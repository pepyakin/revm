[package]
name = "revm-interpreter"
description = "Revm Interpreter that executes bytecode."
version = "34.0.0"
authors.workspace = true
edition.workspace = true
keywords.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
rust-version.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[dependencies]
# revm
bytecode = { package = "revm-bytecode", version = "9.0.0", default-features = false }
primitives = { package = "revm-primitives", version = "22.1.0", default-features = false }
context-interface = { package = "revm-context-interface", version = "16.0.0", default-features = false }
state = { package = "revm-state", version = "10.0.0", default-features = false }

# optional
serde = { version = "1.0", default-features = false, features = ["derive", "rc"], optional = true }

[dev-dependencies]
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }

[features]
default = ["std"]
std = [
	"serde?/std",
	"primitives/std",
	"context-interface/std",
	"bytecode/std",
	"state/std",
	"serde_json/std",
]
hashbrown = ["primitives/hashbrown"]
serde = [
	"dep:serde",
	"primitives/serde",
	"bytecode/serde",
	"context-interface/serde",
	"state/serde",
]
arbitrary = ["std", "primitives/arbitrary"]
# TODO : Should be set from Context or from crate that consumes this PR.
memory_limit = []
